models:
  - name: stg_job_postings
    description: Staging model for job postings.
    columns:
      - name: job_id
        data_tests:
          - not_null
        description: The scraper's posting id.
      - name: job_title
        description: Posting title as scraped.
      - name: company_name
        description: Employer name, trimmed.
      - name: job_location
        description: Posting location as scraped.
      - name: source_platform
        description: Posting platform with 'via' prefix removed.
      - name: job_posted_at
        description: Relative posted time as scraped.
      - name: job_schedule_type
        description: Schedule type as scraped (full-time, part-time, etc.).
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: searched_at
        description: Scrape timestamp (renamed from search_time).
      - name: search_date
        description: Scrape date.
      - name: search_term
        description: The role the scraper searched for.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer','Data Analyst','Data Scientist']
      - name: search_location
        description: Location parameter the scraper searched under.
      - name: job_salary
        description: Raw salary text as scraped.
      - name: salary_min
        data_tests:
          - not_negative
        description: Lower bound parsed from salary text.
      - name: salary_max
        data_tests:
          - not_negative
        description: Upper bound parsed from salary text.
      - name: salary_avg
        data_tests:
          - not_negative
        description: Average midpoint between salary_min and salary_max.
      - name: salary_period
        data_tests:
          - accepted_values:
              arguments:
                values: ['year', 'hour', 'month', 'day', 'week']
        description: Pay period parsed from salary text (year, hour, month, day, week).
      - name: salary_currency
        description: Currency symbol or code parsed from salary text (defaults to USD).
      - name: has_no_degree_mentioned
        description: True if posting mentions no degree is required.
      - name: has_health_insurance
        description: True if posting offers health insurance.
      - name: has_dental_insurance
        description: True if posting offers dental insurance.
      - name: has_paid_time_off
        description: True if posting offers paid time off (PTO).

  - name: stg_job_skills
    description: Staging model for job skills.
    columns:
      - name: job_id
        data_tests:
          - not_null
        description: Foreign key to job postings.
      - name: skill_id
        data_tests:
          - not_null
        description: Skill key.
      - name: skill_keyword
        data_tests:
          - not_null
          - not_empty_string
        description: Skill text as extracted, trimmed.

unit_tests:
  - name: test_parse_salary_shape
    description: "This handles a range, a single value, and no salary at all"
    model: stg_job_postings
    given:
      - input: source('jobs','raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "100K–154K a year"}
          - {job_id: 2, job_salary: "43.50 an hour"}
          - {job_id: 3, job_salary: "544k–1M a year"}
          - {job_id: 4, job_salary: null}
    expect:
      rows:
        - {job_id: 1, salary_min: 100000.00, salary_max: 154000.00, salary_avg: 127000.00, salary_period: 'year', salary_currency: 'USD'}
        - {job_id: 2, salary_min: 43.50,     salary_max: 43.50,     salary_avg: 43.50,     salary_period: 'hour', salary_currency: 'USD'}
        - {job_id: 3, salary_min: 544000.00, salary_max: 1000000.0, salary_avg: 772000.00, salary_period: 'year', salary_currency: 'USD'}
        - {job_id: 4, salary_min: null,      salary_max: null,      salary_avg: null,      salary_period: null,   salary_currency: null}